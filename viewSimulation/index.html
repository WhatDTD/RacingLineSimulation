<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Simulator</title>
    <link rel="stylesheet" href="style.css"></link>
  </head>
  <body>
    <canvas id="canvas" tabindex="1"></canvas>
    <div class="box" style="background-color: rgba(0, 3, 30, 0.4);" id="animationUi">
      <button class="button is-small is-responsive" id="playPause"><img src='./resources/playIcon.svg' alt='Play/Pause'/></button>
      <div class='slidecontainer'>
        <input type='range' min='0' max='0' value='0' class='slider' id='timeLine'>
      </div>
      <button class="button is-small is-responsive" id="prevCar"><img src='./resources/leftArrowIcon.svg' alt='Previous Car'/></button>
      <button class="button is-small is-responsive" id="nextCar"><img src='./resources/rightArrowIcon.svg' alt='Next Car'/></button>
      <button class="button is-info is-small is-responsive" id="nextCamera"><img src='./resources/cameraIcon.svg' alt='Change Camera'/></button>
    </div>


    <div class="box" style="background-color: rgba(0, 3, 30, 0.4);" id="buttonsUi">
      <button class="button buttonMargin is-focus is-small is-responsive" id="clearSimulations">Clear Simulations</button>

      <button class="button buttonMargin is-link is-small is-responsive" id="importTrackModelBtn">
        <span>↑ Import Track</span>
        <input class="file-input" type="file" accept=".glb" id="importTrackModel"/>
      </button>

      <button class="button buttonMargin is-light is-small is-responsive" id="importSimulationBtn">
        <span>↑ Import Simulation</span>
        <input class="file-input" type="file" accept=".RLSsim" id="importSimulation"/>
      </button>
      
    </div>

    <div class="box" id="telemetryBox">
      <div class="title is-6" id="carName">No Car</div>
      <progress class="progress is-danger" id="brakeBar" value="0" max="100"></progress>
      <progress class="progress is-info" id="RPMbar" value="0" max="0"></progress>
      <progress class="progress is-success" id="throttleBar" value="0" max="100"></progress>
      <div id="RPM">0</div>
      <div class="title is-3" id="gear">N</div>
      <div class="title is-4" id="speed">0</div>
      <hr id="division">
      <div id="deltaLabel">Delta:</div>
      <div id="delta">+0.000</div>
    </div>

    <div class="box" style="background-color: rgba(0, 3, 30, 0.4);" id="Gmeter">
      <canvas id="GmeterCanvas"></canvas>
      <div class="title is-4" id="GmeterLabel">No data</div>
      <div id="peakGLabel">peak: No data</div>
    </div>

    <div class="box" id="simulationInfoBox"><div id="simulationInfo">No Simulation Selected Yet</div></div>
    
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="SimulationAnimation.js"></script>
    <script src="script.js"></script>
    <script src="Gmeter.js"></script>
    <script src="telemetry.js"></script>
  </body>
</html>
