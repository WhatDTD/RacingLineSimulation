<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Line Simulation</title>
    <link rel="icon" type="image/x-icon" href="assets/RLSlogo.ico">
    <link rel="preload" href="assets/SFMono-Light.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/SFMono-Medium.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/noBackgroundRLS.svg" as="image">

    <style>
:root {
  --color-background: #06061c;
}

@font-face {
  font-family: 'SF_mono_light';
  src: url('./assets/SFMono-Light.woff2') format('woff2'),
       url('./assets/SFMono-Light.otf') format('opentype'); 
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'SF_mono_medium';
  src: url('./assets/SFMono-Medium.woff2') format('woff2'),
       url('./assets/SFMono-Medium.otf') format('opentype'); 
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

body {
  margin: 0;
  background-color: var(--color-background);
}

#content {
  display: flex;
  background-color: var(--color-background);
  flex-direction: column;
  height: 100vh;
}

#RLS {
  padding-top: clamp(50px, 10vw, 110px);
  padding-bottom: clamp(50px, 10vw, 110px);
  width: min(90vw, 500px);
  height: auto;
}

#buttons {
  display: flex;
  flex-direction: column;
  width: min(90vw, 500px);
  animation: 1s ease-in;
}

#buttons a,
#buttons button {
  text-align: left;
  display: flex;
  justify-content: space-between;
  align-items: center;
  text-decoration: none;
  width: 100%;               
  box-sizing: border-box;    
  font-size: clamp(1rem, 4vw + 0.5rem, 1.67rem);
  margin-bottom: 10px;
  border-radius: 30px;
  background: #ff8236;
  color: white;
  border: 2px solid orange;
  padding: 4px 25px 4px 25px;
  font-family: 'SF_mono_medium', sans-serif;
}

#header {
  display: flex;
  flex-direction: column;
  align-items: center;
}

#topbar {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  padding: 10px;
}

@media (max-width: 500px) {
  #topbar {
    padding-top: 40px;
    row-gap: 20px;
    justify-content: center;
  }
}

#bottombar {
  display: flex;
  flex: 1;
  justify-content: center;
}

#githubIcon {
  align-self: flex-end;
  padding-top: 40px;
}

#downloadExample {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  background-color: #ffffff;
  padding: 10px;
  border-radius: 30px;
  text-align: center;
  font-family: 'SF_mono_light', sans-serif;
  color: #06061c;
  box-sizing: border-box;
}

#buttons a,
#buttons button {
  background-color: #ff8236;
  transition: background-color 0.2s ease;
}

#buttons a:hover,
#buttons button:hover {
  background-color: #ffa309;
}

#buttons a span,
#buttons button span {
  display: inline-block;
  transition: transform 0.2s ease;
}

#buttons a:hover span,
#buttons button:hover span {
  transform: translateX(-1rem) rotate(180deg);
}

#githubIcon {
  transform: scale(1.1);
  transition: transform 0.1s ease-out;
}

#githubIcon:hover {
  transform: scale(1.3) translateY(-0.25rem);
}

#downloadExample {
  transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
}

#downloadExample:hover {
  transform: scale(1.05);
  box-shadow: 0 0.5rem 1rem rgba(255, 255, 255, 0.15);
}

#downloadExample:active {
  background-color: #fff2d6;
  transform: scale(0.97);
}

#RLS {
  animation: logoEnter 0.6s ease forwards;
}

@keyframes logoEnter {
  from {
    opacity: 0;
    transform: translateY(0.75rem) scale(0.98);
  }

  to {
    opacity: 1;
  }
}

#whatdtdIcon {
  transition: transform 0.2s ease;
  height: 80px;
  width: auto;
}

#whatdtdIcon:hover {
  transform: rotate(-2deg) scale(1.04);
}

#buttons a,
#buttons button {
  opacity: 0;
  animation: buttonEnter 0.5s ease forwards;
}

#buttons a:nth-child(1), #buttons button:nth-child(1) { animation-delay: 0.05s; }
#buttons a:nth-child(2), #buttons button:nth-child(2) { animation-delay: 0.1s; }
#buttons a:nth-child(3), #buttons button:nth-child(3) { animation-delay: 0.15s; }
#buttons a:nth-child(4), #buttons button:nth-child(4) { animation-delay: 0.2s; }

@keyframes buttonEnter {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}
    </style>
</head>

<body>
    <div id="content">
        <div id="topbar">
            <img id="whatdtdIcon" src="assets/WhatDTDWhite.svg" alt="WhatDTD" height="80" width="182" decoding="async">
            <a id="downloadExample" href="assets/example.zip" download>Download Simulation Examples</a>
        </div>

        <div id="header">
            <img id="RLS" src="assets/noBackgroundRLS.svg" alt="Racing Line Simulation" width="476" height="241" fetchpriority="high" decoding="async">
            <div id="buttons">
                <a href="createCar" id="createCarButton">Create car<span>→</span></a>
                <a href="createLine" id="createLineButton">Create line<span>→</span></a>
                <a href="createSimulation" id="createSimulationButton">Create simulation<span>→</span></a>
                <a href="viewSimulation" id="viewSimulationButton">View simulation<span>→</span></a>
            </div>
        </div>

        <div id="bottombar">
            <a href="https://github.com/WhatDTD/RacingLineSimulation/" target="_blank" rel="noopener noreferrer">
                <img id="githubIcon" src="assets/githubIcon.png" alt="GitHub" width="35" height="35" loading="lazy" decoding="async">
            </a>
        </div>
    </div>
</body>

</html>
